services:
  vigilante:
    build: .
    container_name: vigilante_bot
    restart: unless-stopped
    networks:
      - mi-red-privada
    environment:
      - TZ=America/Mexico_City

      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DB_HOST=postgres_db
      - DB_NAME=db_crypto
      - DB_USER=postgres
      - DB_PASS=${DB_PASS}

networks:
  mi-red-privada:
    external: true
